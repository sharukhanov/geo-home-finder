<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use the full screen; safe-area
         insets in the CSS keep controls clear of the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fatera — где снять квартиру, чтобы успевать везде</title>
    <meta
      name="description"
      content="Отметьте работу, зал и учёбу — покажем на карте районы Москвы, из которых вы доедете до всех вовремя, с учётом пробок в час пик."
    />

    <!-- Link preview. Most arrivals come from a social post, where the card is
         the whole first impression; without these the link shows up bare. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fatera" />
    <meta property="og:title" content="Где снять квартиру, чтобы успевать везде" />
    <meta
      property="og:description"
      content="Отметьте работу, зал и учёбу — покажем на карте районы Москвы, из которых вы доедете до всех вовремя."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Leaflet is bundled from node_modules instead of a CDN: CDN hosts are
         unreachable on some of our users' networks, and a map script that
         fails to load takes the whole page down with it. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
