<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use the full screen; safe-area
         insets in the CSS keep controls clear of the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fatera - Оптимизация места проживания в Москве</title>
    <meta name="description" content="Найдите оптимальное место проживания в Москве с учетом ваших повседневных маршрутов. Интерактивная карта с AI-рекомендациями зон для комфортной жизни." />
  </head>
  <body>
    <div id="root"></div>
    <!-- Leaflet is bundled from node_modules instead of a CDN: CDN hosts are
         unreachable on some of our users' networks, and a map script that
         fails to load takes the whole page down with it. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
